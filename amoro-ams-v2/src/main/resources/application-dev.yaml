# Local development profile (activated by default via spring.profiles.default in
# application.yaml; override with --spring.profiles.active=<other>).
#
# It connects to the local Docker MySQL prepared with:
#
#   docker run -d --name amoro-v2-mysql -p 3306:3306 \
#     -e MYSQL_ROOT_PASSWORD=amoro123456 -e MYSQL_DATABASE=amoro_v2 \
#     mysql:5.7.44 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
#
# The service creates the amoro_process_v2 table idempotently on every boot
# (schema-mysql.sql), so no manual DDL step is needed.

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/amoro_v2?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: amoro123456

amoro:
  process:
    simulation:
      # keep false so the default context ships no engine/action (test contract);
      # set true to exercise the simulated local/remote engines and dummy actions
      enabled: false
